[project]
name = "nem-mcp"
version = "0.1.0"
description = "An MCP server that gives an AI assistant live data from the Australian National Electricity Market, with a small Python client for the same data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pandas>=2.2", "mcp>=2.0"]

[project.scripts]
nem-mcp = "nem_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nem", "src/nem_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
